<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>f@#you.css</title>
  <link rel="stylesheet" href="f-you-css.css">
</head>
<body>

<!-- TUTORIALS: https://fossheim.io/writing/ -->
<div aria-label="Mechanical keyboard that spells 'FUCK YOU'" class="keyboard">
<div aria-hidden="true" class="keys-container">
<div class="top-wrapper">
<div class="key light">
<div class="inner"><p>F</p></div>
</div>
<div class="key light">
<div class="inner"><p>U</p></div>
</div>
<div class="key light">
<div class="inner"><p>C</p></div>
</div>
<div class="key light">
<div class="inner"><p>K</p></div>
</div>
<div class="key light symbols">
<div class="inner">
<p>
<span>@</span>
<br/>
<span>#</span>
</p>
</div>
</div>
</div>
<div class="middle-wrapper">
<div class="key light">
<div class="inner"><p>Y</p></div>
</div>
<div class="key light">
<div class="inner"><p>O</p></div>
</div>
<div class="key light">
<div class="inner"><p>U</p></div>
</div>
<div class="key dark enter">
<div class="inner"><p>Enter</p></div>
</div>
</div>
<div class="bottom-wrapper">
<div class="key light">
<div class="inner"></div>
</div>
</div>
</div>
</div>
</body>
</html>
