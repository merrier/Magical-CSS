<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aku-Aku mask from Crash Bandicoot in CSS (pick-an-emotion!)</title>
  <link rel="stylesheet" href="aku-aku-mask-from-crash-bandicoot-in-css-pick-an-emotion-.css">
</head>
<body>

<input class="special-mask option" id="special-mask" name="special-mask" type="checkbox" value="true"/>
<label class="option" for="special-mask">✨ Golden mask</label>
<input class="talking-mask option" id="talking-mask" name="talking-mask" type="checkbox" value="true"/>
<label class="option" for="talking-mask">💬 Talking mask</label>
<input checked="checked" class="mask-emotions--neutral option" id="mask-emotions--neutral" name="mask-emotions" type="radio" value="true"/>
<label class="option" for="mask-emotions--neutral">😐 neutral
</label>
<input class="mask-emotions--angry option" id="mask-emotions--angry" name="mask-emotions" type="radio" value="true"/>
<label class="option" for="mask-emotions--angry">😡 angry
</label>
<input class="mask-emotions--sad option" id="mask-emotions--sad" name="mask-emotions" type="radio" value="true"/>
<label class="option" for="mask-emotions--sad">😞 sad
</label>
<input class="mask-emotions--shocked option" id="mask-emotions--shocked" name="mask-emotions" type="radio" value="true"/>
<label class="option" for="mask-emotions--shocked">😨 shocked
</label>
<input class="mask-emotions--confused option" id="mask-emotions--confused" name="mask-emotions" type="radio" value="true"/>
<label class="option" for="mask-emotions--confused">🤔 confused
</label>
<div class="aku-aku star">
<div class="mask-wrapper star">
<div class="feathers">
<div class="feather"></div>
<div class="feather"></div>
<div class="feather"></div>
<div class="feather"></div>
</div>
<div class="mask">
<div class="nose"></div>
<div class="eye eye--left">
<div class="brow brow--left"></div>
</div>
<div class="eye eye--right">
<div class="brow brow--right"></div>
</div>
<div class="goatee"></div>
<div class="mouth">
<div class="teeth"></div>
</div>
</div>
</div>
</div>
</body>
</html>
