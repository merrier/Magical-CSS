<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Dino</title>
  <link rel="stylesheet" href="css-dino.css">
</head>
<body>
 
<input checked="" id="pixelize" type="checkbox"/><label for="pixelize" id="label-pixels">Pixelize game</label>
<form action="javascript:void(0)" method="get">

<input id="cactus-1" type="checkbox"/>

<input id="cactus-13" type="checkbox"/>
<input id="cactus-14" type="checkbox"/>
<input id="cactus-15" type="checkbox"/>
<input id="cactus-16" type="checkbox"/>

<h1>CSS Dino</h1>
<label aria-label="Click here to start" for="start-game"></label>
</div>
<div id="game">

<label for="cactus-1"></label>

<label for="cactus-12"></label>
<label for="cactus-13"></label>
<label for="cactus-14"></label>
<label for="cactus-15"></label>
<label for="cactus-16"></label>
<label for="cactus-17"></label>
<div id="you-won">
<h2>YOU WON<h2>
<input type="reset" value="◄"/>
</h2></h2></div>
</div>
<div id="dinosaur"></div>
<div id="gameover">
<h2>GAME OVER</h2>
<input type="reset" value="◄"/>
</div>
</div>
</form>

</html>
