<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light/dark moon emoji toggle (in CSS)</title>
  <link rel="stylesheet" href="light-dark-moon-emoji-toggle-in-css-.css">
</head>
<body>
<input id="moon-mode" type="checkbox" aria-label="Toggle dark mode">
<label for="moon-mode" class="toggle">
<div class="eye eye-left">
<div class="eye__inner">
</div>
</div>
<div class="eye eye-right">
<div class="eye__inner"></div>
</div>
<div class="nose"></div>
<div class="mouth">
<div class="lip lip__upper"></div>
<div class="lip lip__bottom"></div>
</div>
</label>
</body>
</html>
