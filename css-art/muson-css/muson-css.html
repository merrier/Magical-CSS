<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>muson.css</title>
  <link rel="stylesheet" href="muson-css.css">
</head>
<body>
<div aria-label="Muson Synth Illustration" class="muson">
<div class="top-bar">
<div class="speaker-bar"><div class="speakers"></div></div>
<div class="muson-frame"><div class="rainbow"></div></div>
</div>
<div aria-hidden="true" class="range-container">
<div class="range-plate">
<div class="left">
<ul class="ranges">
<li>1–4</li>
<li>1–6</li>
<li>1–8</li>
<li>1–10</li>
</ul>
<p>Range</p>
<div class="slider-wrapper">
<div class="slider"></div>
</div>
</div>
<div class="center">
<p>Volume</p>
<ul>
<li>Lo</li>
<li>Med</li>
<li>High</li>
</ul>
<div class="switch-wrapper">
<div class="switch-button"></div>
</div>
</div>
<div class="right">
<p>Mode</p>
<ul>
<li>Off</li>
<li>Organ</li>
<li>Organ <br/>&amp; Synth</li>
</ul>
<div class="slider-wrapper">
<div class="slider"></div>
</div>
</div>
</div>
</div>
<div class="button-container">
<div class="button">
<div class="center"></div>
</div>
<div class="button">
<div class="center"></div>
</div>
<div class="button">
<div class="center"></div>
</div>
<div class="button">
<div class="center"></div>
</div>
<div class="button">
<div class="center"></div>
</div>
<div class="button">
<div class="center"></div>
</div>
<div class="button">
<div class="center"></div>
</div>
<div class="button">
<div class="center"></div>
</div>
<div class="button">
<div class="center"></div>
</div>
<div class="button">
<div class="center"></div>
</div>
</div>
<div aria-hidden="true" class="letter-container">
<div>
<p>C</p>
</div>
<div>
<p>D</p>
</div>
<div>
<p>E</p>
</div>
<div>
<p>F</p>
</div>
<div>
<p>G</p>
</div>
<div>
<p>A</p>
</div>
<div>
<p>B</p>
</div>
<div>
<p>C</p>
</div>
<div>
<p>D</p>
</div>
<div>
<p>E</p>
</div>
</div>
<div class="key-container">
<div style="z-index: 12;"></div>
<div style="z-index: 11;"></div>
<div style="z-index: 10;"></div>
<div style="z-index: 9;"></div>
<div style="z-index: 8;"></div>
<div style="z-index: 7;"></div>
<div style="z-index: 6;"></div>
<div style="z-index: 5;"></div>
<div style="z-index: 4;"></div>
<div style="z-index: 3;"></div>
</div>
<div aria-hidden="true" class="speed-container">
<p>Fast</p>
<div class="speed-slider"></div>
<div class="speed-button-container">
<div class="speed-button"></div>
</div>
<p>Slow</p>
</div>
<div aria-hidden="true" class="vol-container">
<p>High</p>
<div class="vol-slider"></div>
<div class="vol-button-container">
<div class="vol-button"></div>
</div>
<p>Low</p>
</div>
</div>

</html>
