<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saitama Funko Pop version (Pure CSS)</title>
  <link rel="stylesheet" href="saitama-funko-pop-version-pure-css.css">
</head>
<body>
 <div class="container">
<div class="saitama">
<div class="head">
<div class="face">
<div class="eyebrow eyebrow-left"></div>
<div class="eyebrow eyebrow-right"></div>
<div class="eye eye-left"></div>
<div class="eye eye-right"></div>
<div class="nose"></div>
</div>
<div class="ear ear-left"></div>
<div class="ear ear-right"></div>
</div>
<div class="body">
<div class="neck"></div>
<div class="collar">
<div class="zipper"></div>
</div>
<div class="chest"></div>
<div class="upper-arm upper-arm-left"></div>
<div class="upper-arm upper-arm-right"></div>
<div class="hand-left">
<div class="glove glove-top"></div>
<div class="glove glove-bottom">
<div class="thumb"></div>
<div class="other-fingers"></div>
</div>
</div>
<div class="hand-right">
<div class="glove glove-top">
</div>
<div class="glove glove-bottom">
<div class="thumb"></div>
<div class="other-fingers"></div>
</div>
</div>
<div class="belt"></div>
<div class="upper-leg upper-leg-left"></div>
<div class="upper-leg upper-leg-right"></div>
<div class="boots">
<div class="boot boot-left"></div>
<div class="boot boot-right"></div>
</div>
<div class="cape"></div>
</div>
</div>
</div>
</body>
</html>
