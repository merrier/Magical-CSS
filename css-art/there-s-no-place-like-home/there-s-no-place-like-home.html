<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>There&#x27;s no place like home</title>
  <link rel="stylesheet" href="there-s-no-place-like-home.css">
</head>
<body>
<div class="container">
<div class="house" id="house">
<div class="house-base">
<div class="house-base-detail"></div>
<div class="house-door-wrapper">
<div class="house-door">
<div class="house-door-window"></div>
<div class="house-door-detail"></div>
</div>
</div>
<div class="house-window-wrapper">
<div class="house-window house-window-left"></div>
<div class="house-window house-window-right"></div>
</div>
</div>
<div class="house-sandwich"></div>
<div class="house-upper">
<div class="house-upper-detail"></div>
<div class="house-upper-shadow"></div>
<div class="house-window"></div>
<div class="house-window-wrapper">
<div class="house-window house-window-left"></div>
<div class="house-window house-window-right"></div>
</div>
</div>
<div class="house-roof">
<div class="house-roof-side house-roof-side-left"></div>
<div class="house-roof-side house-roof-side-right"></div>
<div class="house-roof-detail"></div>
</div>
</div>
</div>
<div class="color-controls">
<p>
		Select a colour
	</p>
<div class="color-controls-button-container">
<input type="radio" name="house-color" class="color-controls-button pallet" value="pallet" aria-label="pallet" checked>
<input type="radio" name="house-color" class="color-controls-button viridian" value="viridian" aria-label="viridian">
<input type="radio" name="house-color" class="color-controls-button pewter" value="pewter" aria-label="pewter">
<input type="radio" name="house-color" class="color-controls-button cerulean" value="cerulean" aria-label="cerulean">
<input type="radio" name="house-color" class="color-controls-button vermillion" value="vermillion" aria-label="vermillion">
<input type="radio" name="house-color" class="color-controls-button lavender" value="lavender" aria-label="lavender">
<input type="radio" name="house-color" class="color-controls-button celadon" value="celadon" aria-label="celadon">
<input type="radio" name="house-color" class="color-controls-button saffron" value="saffron" aria-label="saffron">
<input type="radio" name="house-color" class="color-controls-button fuschia" value="fuschia" aria-label="fuschia">
<input type="radio" name="house-color" class="color-controls-button cinnabar" value="cinnabar" aria-label="cinnabar">
</div>
</div>
</body>
</html>
