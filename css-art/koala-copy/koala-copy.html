<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koala Copy</title>
  <link rel="stylesheet" href="koala-copy.css">
</head>
<body>
<!-- Begin Image -->
<!-- Invisible Box-->
<div class="box"> <!-- No closing div tag until near the end -->
<!--Circular Head-->
<div class="head">
<!-- Nested divs: 
    All other shapes will be on top of the   
    head-->
<!-- Circular Head Copy -->
<!-- used to allow the ears to appear  
      behind the head -->
<div class="head-copy"></div>
<!--Left Ear ~ Light Gray -->
<div class="ear-left">
<!-- Inner ear ~ Dark Gray -->
<div class="inner-ear"></div> <!-- Closing div tag of Left ear -->
</div>
<!-- Nested divs: 
      Ear-right is the parent div; inner-ear is a       child div; percentage for widths and    
      heights of shapes applies to parent div -->
<!-- Right Ear ~ Light Gray -->
<div class="ear-right">
<!-- Inner Ear ~ Dark Dray -->
<div class="inner-ear"></div>
</div>
<!-- Left Outer Eye ~ White -->
<div class="eye-left">
<!-- Pupil ~ Black -->
<div class="pupil"></div>
</div>
<!-- Right Outer Eye ~ White -->
<div class="eye-right">
<!-- Pupil ~ Black -->
<div class="pupil"></div>
</div>
<!-- Nose ~ Brown -->
<div class="nose">
</div>
<!-- Challenge: Add Mouth ~ Coral -->
<div class="mouth"></div>
<!--Challenge: Add Tongue ~ Red -->
<div class="tongue"></div>
<!-- Hair ~ Light Gray -->
<div class="hair-left"></div>
<div class="hair-right"></div>
<!-- End Head -->
</div>
<!-- End Invisibile Box -->
</div>
</body>
</html>
