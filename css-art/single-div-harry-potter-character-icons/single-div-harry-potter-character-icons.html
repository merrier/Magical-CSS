<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Single div Harry Potter character icons</title>
  <link rel="stylesheet" href="single-div-harry-potter-character-icons.css">
</head>
<body>
<div class="container">
<div aria-label="Cartoon of a Griffindor student (Harry Potter), a boy with rounded glasses and a scar in the forehead, wearing a red and gold scarf" class="hp-character griffindor" role="img"></div>
<div aria-label="Cartoon of a Slytherin student (Draco Malfoy), an angry-looking boy with silvery hair, wearing a green and silver scarf" class="hp-character slytherin" role="img"></div>
<div aria-label="Cartoon of a Ravenclaw student, a girl with long hair and long eye lashes, wearing a blue and bronze scarf" class="hp-character ravenclaw" role="img"></div>
<div aria-label="Cartoon of a Hufflepuff student, a Black boy with dark hair and eyebrows, wearing a black and yellow scarf" class="hp-character hufflepuff" role="img"></div>
</div>
</body>
</html>
