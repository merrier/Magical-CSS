<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello-Kitty</title>
  <link rel="stylesheet" href="hello-kitty.css">
</head>
<body>
<article class="kitty">
<div class="kitty__head">
<div class="nose"></div>
<div class="eye eye--left"></div>
<div class="eye eye--right"></div>
</div>
<div class="ear ear--left"></div>
<div class="ear ear--right"></div>
<div class="whisker first"></div>
<div class="whisker second"></div>
<div class="whisker third"></div>
<div class="whisker first--right--side"></div>
<div class="whisker second--right--side"></div>
<div class="whisker third--right--side"></div>
<div class="head"></div>
<div class="bow">
<div class="pink"></div>
<div class="pink-side pink--left"></div>
<div class="pink-side pink--right"></div>
</div>
</article>
</body>
</html>
