<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pure CSS Cassette Player</title>
  <link rel="stylesheet" href="pure-css-cassette-player.css">
</head>
<body>
 <div class="container">
<div class="walkman">
<div class="front">
<div class="logo">SONY</div>
<div class="controls-container">
<div class="fast-forward"></div>
<div class="rewind"></div>
<div class="play-button"></div>
<div class="off-button"></div>
<div class="fm-button"></div>
</div>
<div class="indicators">
<div class="battery-indicator"></div>
<div class="fm-indicator"></div>
</div>
<div class="labels">WALKMAN</div>
</div>
<div class="volume-control"></div>
<div class="tuning-control"></div>
<div class="jack1"></div>
<div class="jack2"></div>
</div>
</div>
</body>
</html>
