<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Homer Simpson</title>
  <link rel="stylesheet" href="css-homer-simpson.css">
</head>
<body>
<div id="homer">
<div id="head" style="">
<div id="shadow"></div>
<div id="neck"></div>
<div class="cheek"></div>
<div id="forehead"></div>
<div class="ear left"></div>
<div id="eyebrow"></div>
<div class="eye left"></div>
<div id="beard"></div>
<div id="smile"></div>
<div id="upper-lip"></div>
<div id="nose"></div>
<div class="eye"></div>
<div class="hair-top"></div>
<div class="hair-top left"></div>
<div id="hair"></div>
<div class="ear"></div>
<div id="v-neck"></div>
<div class="shirt-neck"></div>
</div>
<div id="legs">
<div class="shoe"></div>
<div class="shoe right"></div>
<div class="tacon"></div>
<div class="opening left"></div>
<div class="leg left"></div>
<div id="waist"></div>
<div class="leg right"></div>
<div class="opening"></div>
</div>
<div id="body">
<div class="shirt-arm left"><div></div></div>
<div id="shirt"><div></div></div>
<div id="shirt-bg"></div>
<div id="shirt-line-2"></div>
<div id="arm"></div>
<div class="finger" id="finger-1"></div>
<div class="finger" id="finger-2"></div>
<div class="finger" id="finger-3"></div>
<div class="shirt-arm"><div></div></div>
<div class="line-pants"></div>
</div>
</div>
<div id="links">
<a href="https://github.com/alvaromontoro/CSS-Simpsons" target="_blank">More on GitHub</a>
<a href="https://codepen.io/collection/DrwLdN/" target="_blank">More on CodePen</a>
</div>
</body>
</html>
