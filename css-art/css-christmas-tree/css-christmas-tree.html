<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Christmas Tree</title>
  <link rel="stylesheet" href="css-christmas-tree.css">
</head>
<body>
<input checked="" id="show-deco" type="checkbox"/>
<label for="show-deco">Show decorations</label>
<input id="lights" type="checkbox"/>
<label for="lights">Lights on</label>
<div aria-label="Cartoon of a Christmas tree" class="canvas yes-deco" role="img">
<div class="shadow"></div>
<div class="trunk"></div>
<div class="leaves bottom"></div>
<div class="leaves middle"></div>
<div class="leaves top"></div>
<div class="deco decoration balls"></div>
<div class="deco decoration decoration-1"></div>
<div class="deco decoration decoration-2"></div>
<div class="deco decoration lights">
<div class="light"></div>
<div class="light"></div>
<div class="light"></div>
<div class="light"></div>
<div class="light"></div>
<div class="light"></div>
</div>
<div class="deco star">
<div class="point"></div>
<div class="point"></div>
<div class="point"></div>
<div class="point"></div>
<div class="point"></div>
</div>
</div>
<a href="https://www.youtube.com/watch?v=0bMpeblJuOU" id="youtube" target="_blank">
<span>See how this demo was coded</span>
</a>

</body>
</html>
