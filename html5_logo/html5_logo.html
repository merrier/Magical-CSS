<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTML5 盾牌标志</title>
  <link rel="stylesheet" href="html5_logo.css">
</head>
<body>
<div id="logo">
    <div id="letters">
    	<div id="H">
    		<span class="v">|</span><span class="h">-</span><span class="v">|</span>
    	</div>
        <div id="T">
            <span class="h">+</span><br />
            <span class="v">|</span>
        </div>
        <div id="M">
            <span class="v">|</span>
            <span class="h">\</span>
            <span class="h">/</span>
            <span class="v">|</span>
        </div>
        <div id="L">
            <span class="v">|</span><span class="h">_</span>
        </div>
    </div>
    <div id="shield">
        <div class="left">
            <span class="wing">这</span>
            <span class="base">不是</span>
        </div>
        <div class="right">
            <span class="wing">图片</span>
            <span class="base">的说</span>
        </div>
        <div class="highlight">
            <span class="spine">这</span>
            <span class="wing">是</span>
            <span class="base">HTML~~</span>
        </div>
    </div>

    <div id="five">
        <div id="head">当然</div>
        <div id="topright">使用了</div>

        <div id="topleft">比较</div>
        <div id="topdrop">犀利</div>
        <div id="midbar">的</div>
        <div id="midbarhi">语言</div>
        <div id="middrop">名叫</div>
        <div id="botright">CSS</div>
        <div id="botleft">的说</div>
        <div id="tail">…</div>
    </div>
</div>
</body>
</html>
